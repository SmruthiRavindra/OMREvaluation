<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Vision OMR Portal</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --background: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --error: #ef4444;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--background);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      padding: 40px 32px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: #eeebff;
      color: var(--primary);
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .logo-svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #334155;
    }

    .input-field {
      width: 100%;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 14px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      transition: all 0.15s ease;
      outline: none;
    }

    .input-field:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .error-banner {
      display: none;
      background-color: #fef2f2;
      border: 1px solid #fca5a5;
      color: var(--error);
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      margin-bottom: 20px;
      text-align: left;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .submit-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="header">
      <div class="logo-container">
        <svg class="logo-svg" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
        </svg>
      </div>
      <h1 class="title">Vision OMR System</h1>
      <p class="subtitle">Academic Grading Portal</p>
    </div>

    <div id="errorBanner" class="error-banner"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="usernameInput" class="label">Username</label>
        <input type="text" id="usernameInput" class="input-field" placeholder="Enter username" required autocomplete="username">
      </div>
      
      <div class="form-group" style="margin-bottom: 24px;">
        <label for="passwordInput" class="label">Password</label>
        <input type="password" id="passwordInput" class="input-field" placeholder="Enter password" required autocomplete="current-password">
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">
        <span id="btnSpinner" class="spinner"></span>
        <span id="btnText">Sign In</span>
      </button>
    </form>

    <div class="footer-note">
      Internal Use Only &bull; College Administration
    </div>
  </div>

  <script>
    // Detect Node.js Data Gateway URL based on current server hostname
    const GATEWAY_URL = window.location.protocol + '//' + window.location.hostname + ':3000';

    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const submitBtn = document.getElementById('submitBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const errorBanner = document.getElementById('errorBanner');

    // If session token exists, try redirecting directly
    if (localStorage.getItem('session_token')) {
      window.location.href = '/dashboard';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      errorBanner.style.display = 'none';
      submitBtn.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.textContent = 'Authenticating...';

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      try {
        const response = await fetch(`${GATEWAY_URL}/api/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Authentication failed.');
        }

        // Store credentials
        localStorage.setItem('session_token', data.token);
        localStorage.setItem('username', data.user.username);
        localStorage.setItem('user_role', data.user.role);

        // Redirect based on role
        if (data.user.role === 'admin') {
          window.location.href = '/admin';
        } else {
          window.location.href = '/dashboard';
        }

      } catch (err) {
        errorBanner.textContent = err.message;
        errorBanner.style.display = 'block';
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
