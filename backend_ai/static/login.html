<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - OMR Evaluator</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --navy: #16324F;
      --navy-hover: #0E2338;
      --bg: #F4F6F9;
      --surface: #FFFFFF;
      --border: #E1E5EB;
      --text-main: #16324F;
      --text-muted: #7A8799;
      --error: #C0392B;
      --radius-card: 16px;
      --radius-btn: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border-radius: var(--radius-card);
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px -5px rgba(22, 50, 79, 0.08);
      overflow: hidden;
    }

    /* Top Navy Header Block */
    .navy-header {
      background: var(--navy);
      color: #FFFFFF;
      padding: 36px 24px 28px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-badge {
      width: 52px;
      height: 52px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #FFFFFF;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }

    .navy-header .title {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }

    .navy-header .subtitle {
      font-size: 13px;
      color: #B8D0E8;
      font-weight: 400;
    }

    /* Form Body */
    .form-body {
      padding: 28px 24px 24px 24px;
    }

    .error-banner {
      display: none;
      background-color: #FDECEA;
      border: 1px solid #FADBD8;
      color: var(--error);
      padding: 10px 14px;
      border-radius: var(--radius-btn);
      font-size: 13px;
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 14px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      color: var(--text-main);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(22, 50, 79, 0.1);
    }

    .input-field::placeholder {
      color: #A0AEC0;
    }

    .forgot-link-wrapper {
      text-align: right;
      margin-top: -6px;
      margin-bottom: 22px;
    }

    .forgot-link {
      font-size: 12px;
      color: var(--navy);
      font-weight: 600;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--navy);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .submit-btn:hover {
      background: var(--navy-hover);
    }

    .submit-btn:disabled {
      background: #A0AEC0;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer-note strong {
      color: var(--navy);
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <!-- Top Navy Header Card -->
    <div class="navy-header">
      <div class="avatar-badge">OM</div>
      <h1 class="title">OMR Evaluator</h1>
      <p class="subtitle">Sign in to continue</p>
    </div>

    <!-- Form Content -->
    <div class="form-body">
      <div id="errorBanner" class="error-banner"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="usernameInput" class="label">Institution ID</label>
          <input type="text" id="usernameInput" class="input-field" placeholder="e.g. 21BCS114" required autocomplete="username">
        </div>
        
        <div class="form-group">
          <label for="passwordInput" class="label">Password</label>
          <input type="password" id="passwordInput" class="input-field" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <div class="forgot-link-wrapper">
          <a href="#" class="forgot-link" onclick="alert('Please contact your department admin to reset your password.'); return false;">Forgot password?</a>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
          <span id="btnSpinner" class="spinner"></span>
          <span id="btnText">Sign in</span>
        </button>
      </form>
    </div>
  </div>

  <div class="footer-note">
    New here? <strong>Contact your department admin</strong>
  </div>

  <script>
    const GATEWAY_URL = window.location.origin;

    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const submitBtn = document.getElementById('submitBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const errorBanner = document.getElementById('errorBanner');

    // If session token exists, try redirecting directly
    if (localStorage.getItem('session_token')) {
      window.location.href = '/dashboard';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      errorBanner.style.display = 'none';
      submitBtn.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.textContent = 'Authenticating...';

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      try {
        const response = await fetch(`${GATEWAY_URL}/api/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Authentication failed.');
        }

        // Store credentials
        localStorage.setItem('session_token', data.token);
        localStorage.setItem('username', data.user.username);
        localStorage.setItem('user_role', data.user.role);

        // Redirect based on role
        if (data.user.role === 'admin') {
          window.location.href = '/admin';
        } else {
          window.location.href = '/dashboard';
        }

      } catch (err) {
        errorBanner.textContent = err.message;
        errorBanner.style.display = 'block';
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
